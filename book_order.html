<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Book Order Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        font-size: 14px;
      }
      .container {
        width: 580px;
        margin: 0 auto;
        padding: 20px 25px;
        border: 1px solid #b5b5b5;
      }

      h3 {
        margin-bottom: 20px;
        font-size: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }

      .form-group {
        margin-bottom: 8px;
      }
      label {
        display: block;
        margin-bottom: 2px;
      }
      input[type="text"],
      input[type="email"] {
        padding: 3px 5px;
        border: 1px solid #a9a9a9;
        font-size: 13px;
        width: 180px;
        box-sizing: border-box;
        vertical-align: middle;
      }
      .row {
        margin-bottom: 12px;
      }
      .card-icon {
        width: 30px;
        height: 20px;
        vertical-align: middle;
        margin-left: 3px;
        object-fit: contain;
      }
      .calendar-icon {
        width: 24px;
        height: 24px;
        vertical-align: middle;
        margin-left: 4px;
        cursor: pointer;
      }
      .btn {
        padding: 3px 10px;
        background-color: #f0f0f0;
        border: 1px solid #767676;
        border-radius: 2px;
        cursor: pointer;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Book Order Form</h3>

      <form action="#" method="post">
        <table>
          <!-- Name -->
          <div class="form-group">
            <label>Name*</label>
            <input
              type="text"
              name="first_name"
              placeholder="First Name"
              required
            />
            <input
              type="text"
              name="last_name"
              placeholder="Last Name"
              required
            />
          </div>

          <!-- Address -->
          <div class="form-group">
            <label>Address*</label>
            <input type="text" name="village" placeholder="Vilage" required />
          </div>

          <div class="row">
            <input type="text" name="commune" placeholder="Commune" required />
          </div>

          <div class="form-group">
            <input
              type="text"
              name="district"
              placeholder="District"
              required
            />
            <input
              type="text"
              name="province"
              placeholder="Province"
              required
            />
            <input
              type="text"
              name="zip_code"
              placeholder="Zip code"
              required
            />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label>Email*</label>
            <input
              type="email"
              name="email"
              placeholder="yourgmail@gmail.com"
              required
            />
          </div>

          <!-- Product Quantity & Code -->
          <div class="form-group">
            <label>How many do you want to buy? and Code of Product*</label>
            <input
              type="text"
              name="product_info"
              placeholder="Number/Product Name"
              required
            />
          </div>

          <!-- Credit Card -->
          <div class="form-group">
            <label>Credit Card*</label>
            <input
              type="text"
              name="credit_card"
              placeholder="000 000 000"
              required
            />
            <img src="credit-card.png" alt="Credit Card 1" class="card-icon" />
            <img
              src="magnetic-card.png"
              alt="Credit Card 2"
              class="card-icon"
            />
            <img src="visa.png" alt="Visa Card" class="card-icon" />
          </div>

          <!-- Expiration Date -->
          <div class="row">
            <label>Exp. Date*</label>
            <input type="text" name="exp_month" required />
            <input type="text" name="exp_year" required />
            <img src="calendar.png" alt="Calendar" class="calendar-icon" />
          </div>

          <!-- Buttons -->
          <div>
            <input type="submit" value="Pay Now" class="btn" />
            <input type="reset" value="Reset" class="btn" />
          </div>
        </table>
      </form>
    </div>
  </body>
</html>
