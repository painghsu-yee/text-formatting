<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Creation</title>
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        background-color: #ffffff;
        padding: 20px;
      }

      /* အပြင်ဘောင် Container */
      .container {
        width: 580px;
        margin: 0 auto;
        padding: 20px 25px;
        border: 1px solid #b5b5b5;
      }

      h1 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 26px;
        margin-top: 0;
        margin-bottom: 25px;
        color: #000000;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      td {
        padding: 6px 5px;
        vertical-align: middle;
        /* textarea လိုမျိုးအတွက်မဖြစ်မနေ ထည့်ပေးရ */
      }

      /* ဘယ်ဘက် ခေါင်းစဉ်စာသားများ ညာဘက်ကပ်ရန် */
      td.label-col {
        width: 28%;
        text-align: right;
        padding-right: 12px;
        font-size: 15px;
        color: #000000;
      }

      /* Textarea ဘေးက စာသားကို အပေါ်ကပ်ထားရန် */
      td.top-align {
        vertical-align: top;
        padding-top: 8px;
      }

      .required {
        color: red;
      }

      /* စာရိုက်ကွက် အရွယ်အစားများ */
      input[type="text"],
      input[type="email"],
      input[type="password"],
      select,
      textarea {
        border: 1px solid #a9a9a9;
        padding: 3px 5px;
        font-size: 14px;
      }

      .input-medium {
        width: 220px;
      }

      .input-wide {
        width: 360px;
      }

      /* ဖုန်းနံပါတ် ၃ ကွက်စာ */
      .phone-header {
        font-size: 14px;
        padding-bottom: 2px;
      }

      .input-phone {
        width: 102px;
      }

      textarea {
        width: 360px;
        height: 65px;
        resize: both;
      }

      select {
        width: 190px;
        background-color: #f8f8f8;
      }

      .terms-row {
        padding-top: 12px;
        font-size: 14px;
      }

      .terms-row a {
        color: #0000ee;
        font-weight: bold;
      }

      .btn-row {
        padding-top: 10px;
      }

      button {
        padding: 3px 10px;
        font-size: 13px;
        border: 1px solid #888888;
        background-color: #efefef;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 6px;
      }

      button:hover {
        background-color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Register - Create Account</h1>

      <form action="#" method="post">
        <table>
          <tr>
            <td class="label-col"><span class="required">*</span>Your Name</td>
            <td>
              <input
                type="text"
                name="your_name"
                class="input-medium"
                required
              />
            </td>
          </tr>

          <tr>
            <td class="label-col"><span class="required">*</span>E-Mail ID</td>
            <td>
              <input type="email" name="email_id" class="input-wide" required />
            </td>
          </tr>

          <tr>
            <td class="label-col">
              <span class="required">*</span>Alternate<br />E-Mail ID
            </td>
            <td>
              <input
                type="email"
                name="alt_email_id"
                class="input-wide"
                required
              />
            </td>
          </tr>

          <tr>
            <td></td>
            <td class="phone-header">
              Country Code &nbsp;-&nbsp; City Code &nbsp;-&nbsp; Phone Number
            </td>
          </tr>

          <tr>
            <td class="label-col">Your Phone</td>
            <td>
              <input type="text" name="country_code" class="input-phone" /> -
              <input type="text" name="city_code" class="input-phone" /> -
              <input type="text" name="phone_number" class="input-phone" />
            </td>
          </tr>

          <tr>
            <td class="label-col">Mobile Phone</td>
            <td>
              <input type="text" name="mobile_phone" class="input-medium" />
            </td>
          </tr>

          <tr>
            <td class="label-col top-align">
              <span class="required">*</span>Your Postal<br />Address
            </td>
            <td><textarea name="postal_address" required></textarea></td>
          </tr>

          <tr>
            <td class="label-col"><span class="required">*</span>Country</td>
            <td>
              <select name="country" required>
                <option value="">---------Select One---------</option>
                <option value="Myanmar">Myanmar</option>
                <option value="Thailand">Thailand</option>
                <option value="Singapore">Singapore</option>
                <option value="Japan">Japan</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="label-col"><span class="required">*</span>Password</td>
            <td>
              <input
                type="password"
                name="password"
                class="input-medium"
                required
              />
            </td>
          </tr>

          <tr>
            <td class="label-col">
              <span class="required">*</span>Re - Enter<br />Password
            </td>
            <td>
              <input
                type="password"
                name="re_password"
                class="input-medium"
                required
              />
            </td>
          </tr>

          <tr>
            <td></td>
            <td class="terms-row">
              <label>
                <input type="checkbox" name="terms" required />
                <strong>I accept the</strong> <a href="#">Terms of Use</a>
              </label>
            </td>
          </tr>

          <tr>
            <td></td>
            <td class="btn-row">
              <button type="submit">Continue &gt;&gt;</button>
              <button type="reset">Reset</button>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
